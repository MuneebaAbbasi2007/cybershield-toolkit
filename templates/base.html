<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}CyberShield Toolkit{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body class="bg-dark text-light">
    <nav class="navbar navbar-dark bg-black px-4">
        <a class="navbar-brand" href="/"><i class="bi bi-shield-lock"></i> CyberShield Toolkit</a>
        <div>
            <a href="/" class="btn btn-outline-light btn-sm">Home</a>
            <a href="/dashboard" class="btn btn-outline-info btn-sm">Dashboard</a>
            <a href="/download-combined-report" class="btn btn-outline-warning btn-sm">Reports</a>
            <button class="btn btn-outline-light btn-sm" onclick="toggleTheme()"><i class="bi bi-brightness-high" id="themeIcon"></i></button>
        </div>
    </nav>

    <div class="container mt-4">
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
    function toggleTheme() {
        const html = document.documentElement;
        const body = document.body;
        const icon = document.getElementById('themeIcon');
        if (html.getAttribute('data-bs-theme') === 'dark') {
            html.setAttribute('data-bs-theme', 'light');
            body.classList.remove('bg-dark', 'text-light');
            body.classList.add('bg-light', 'text-dark');
            icon.className = 'bi bi-moon-stars';
        } else {
            html.setAttribute('data-bs-theme', 'dark');
            body.classList.remove('bg-light', 'text-dark');
            body.classList.add('bg-dark', 'text-light');
            icon.className = 'bi bi-brightness-high';
        }
    }
    </script>
</body>
</html>
